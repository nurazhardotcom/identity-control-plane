name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install --version 1.13.223
          bb --version

      - name: Run tests
        run: bb test

      - name: Run demo
        run: bb demo

      - name: Daglog round-trip (append then verify, exit 0)
        env:
          CONTROL_PLANE_HMAC_KEY: ci-only-daglog-key-0123456789
        run: |
          bb daglog append ./daglog-ci.edn payments-api vault.read '{:path "transit/sign"}'
          bb daglog verify ./daglog-ci.edn

      - name: Daglog tamper check (verify must exit 1)
        env:
          CONTROL_PLANE_HMAC_KEY: ci-only-daglog-key-0123456789
        run: |
          cp ./daglog-ci.edn ./daglog-tampered.edn
          sed -i 's/vault.read/vault.admin/' ./daglog-tampered.edn
          if bb daglog verify ./daglog-tampered.edn; then
            echo "ERROR: tampered log verified clean"
            exit 1
          else
            echo "tamper detected (exit 1)"
          fi

  portable-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install clojure CLI
        run: |
          curl -fsSLO https://download.clojure.org/install/linux-install-1.12.3.1577.sh
          chmod +x linux-install-1.12.3.1577.sh
          sudo ./linux-install-1.12.3.1577.sh
          clojure -Sdescribe

      - name: Run portable v1 suite
        run: clojure -M:test

  portable-cljs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install clojure CLI
        run: |
          curl -fsSLO https://download.clojure.org/install/linux-install-1.12.3.1577.sh
          chmod +x linux-install-1.12.3.1577.sh
          sudo ./linux-install-1.12.3.1577.sh
          clojure -Sdescribe

      - name: Run headless Web Crypto suite
        run: clojure -M:cljs-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clj-kondo
        run: |
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-amd64.zip
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-amd64.zip.sha256
          echo "$(cat clj-kondo-2026.08.04-linux-amd64.zip.sha256)  clj-kondo-2026.08.04-linux-amd64.zip" | sha256sum -c -
          mkdir -p kondo-tmp && unzip -q clj-kondo-2026.08.04-linux-amd64.zip -d kondo-tmp
          sudo install -m 0755 kondo-tmp/clj-kondo /usr/local/bin/clj-kondo
          clj-kondo --version

      - name: Lint (errors and warnings fail)
        run: clj-kondo --lint src test --fail-level warning

  pdpa-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install ripgrep + babashka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && sudo ./install

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nurazhardotcom/pdpa-sg-clj
          path: pdpa-sg-clj

      - name: scan repo for Singapore PII / secrets (NRIC, tokens)
        run: |
          mv "$GITHUB_WORKSPACE/pdpa-sg-clj" /tmp/pdpa-sg-clj
          output=$(cd /tmp/pdpa-sg-clj && bb scan "$GITHUB_WORKSPACE")
          echo "$output"
          echo "$output" | grep -q "clean? true"
